<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="A map of the system in two lanes, both ending at one contract. Creating and managing: an owner signs with Freighter through the interface in web slash, which deploys the allowance and sets its rules. Paying: an agent uses the SDK to pay an x402 seller through a facilitator, and that payment is checked by the allowance before it moves. The allowance contract holds the USDC and the rules.">
  <title>The parts, and who talks to whom</title>

  <rect x="1" y="1" width="918" height="328" rx="14" fill="#f4f3ef" stroke="#d9d5cb" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

    <rect x="16" y="74" width="600" height="108" rx="12" fill="none" stroke="#c6c0b1" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="16" y="196" width="600" height="108" rx="12" fill="none" stroke="#c6c0b1" stroke-width="1.5" stroke-dasharray="7 5"/>
    <g font-size="10.5" font-weight="700" letter-spacing="1.4" text-anchor="middle">
      <rect x="228" y="66" width="176" height="16" fill="#f4f3ef"/>
      <text x="316" y="78" fill="#6f6a5e">CREATING AND MANAGING</text>
      <rect x="278" y="188" width="76" height="16" fill="#f4f3ef"/>
      <text x="316" y="200" fill="#6f6a5e">PAYING</text>
    </g>

    <g font-size="13" font-weight="600" text-anchor="middle" stroke-width="1.6">
      <rect x="44" y="102" width="140" height="52" rx="8" fill="#e6e5f8" stroke="#6b67b8"/>
      <text x="114" y="133" fill="#3b3880">owner</text>

      <rect x="290" y="102" width="170" height="52" rx="8" fill="#f9e3ec" stroke="#b0648a"/>
      <text x="375" y="133" fill="#78304f">the interface</text>

      <rect x="44" y="224" width="140" height="52" rx="8" fill="#fbeed9" stroke="#bf8534"/>
      <text x="114" y="255" fill="#7a5119">agent</text>

      <rect x="290" y="224" width="170" height="52" rx="8" fill="#e2eaf1" stroke="#5f7f99" stroke-dasharray="5 3"/>
      <text x="375" y="248" fill="#2f4a5c">x402 seller</text>
      <text x="375" y="266" fill="#2f4a5c" font-size="11" font-weight="400">and a facilitator</text>

      <rect x="690" y="134" width="200" height="110" rx="8" fill="#d5e8e2" stroke="#17544a" stroke-width="2.4"/>
      <text x="790" y="176" fill="#0f3e36" font-size="16">allowance</text>
      <text x="790" y="200" fill="#0f3e36" font-size="11" font-weight="400">holds the USDC and the rules</text>
    </g>

    <g font-size="10" text-anchor="middle" font-family="ui-monospace, Cascadia Mono, Menlo, Consolas, monospace">
      <text x="375" y="170" fill="#6f6a5e">web/</text>
      <text x="375" y="292" fill="#6f6a5e">demo/seller/</text>
      <text x="790" y="224" fill="#17544a">contracts/allowance/</text>
    </g>

    <g font-size="11.5" fill="#33323a">

      <line x1="184" y1="128" x2="281" y2="128" stroke="#4a4856" stroke-width="1.7"/>
      <polygon points="290,128 280,123 280,133" fill="#4a4856"/>
      <rect x="205" y="111" width="64" height="15" fill="#f4f3ef"/>
      <text x="237" y="122" text-anchor="middle">Freighter</text>

      <path d="M 460 128 H 640 V 160 H 681" fill="none" stroke="#4a4856" stroke-width="1.7"/>
      <polygon points="690,160 680,155 680,165" fill="#4a4856"/>
      <rect x="467" y="111" width="166" height="15" fill="#f4f3ef"/>
      <text x="550" y="122" text-anchor="middle">deploys it, and sets the rules</text>

      <line x1="184" y1="250" x2="281" y2="250" stroke="#4a4856" stroke-width="1.7"/>
      <polygon points="290,250 280,245 280,255" fill="#4a4856"/>
      <rect x="213" y="226" width="48" height="20" rx="5" fill="#eae7de" stroke="#cdc7b7"/>
      <text x="237" y="240" text-anchor="middle" font-family="ui-monospace, Cascadia Mono, Menlo, Consolas, monospace" font-size="11">sdk/</text>

      <path d="M 460 250 H 640 V 218 H 681" fill="none" stroke="#17544a" stroke-width="2.4"/>
      <polygon points="690,218 679,212.5 679,223.5" fill="#17544a"/>
      <rect x="470" y="233" width="160" height="15" fill="#f4f3ef"/>
      <text x="550" y="244" text-anchor="middle" fill="#0f3e36">pays, and is checked first</text>

    </g>
  </g>
</svg>
