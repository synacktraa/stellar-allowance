name: release

on:
  push:
    tags: ["allowance-contract-v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  allowance:
    name: allowance contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than stable. A compiler bump changes the wasm bytes on its own,
      # and the hash of those bytes is how a deployed contract is identified.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: wasm32v1-none

      - uses: stellar/stellar-cli@v27.1.0

      # The tag names a version and so does Cargo.toml. When they disagree the release
      # carries a label contradicting the crate it was built from, so refuse instead.
      - name: Version
        id: version
        working-directory: contracts
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "allowance") | .version')
          tag=${GITHUB_REF_NAME#allowance-contract-v}
          if [ "$crate" != "$tag" ]; then
            echo "Cargo.toml says $crate, the tag says $tag" >&2
            exit 1
          fi
          echo "$crate"
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      # `source_repo` is what `stellar contract info build` reads to find this run's
      # attestation. `version` lets a deployed allowance name its own version, so
      # nothing has to keep a table mapping wasm hashes back to releases.
      - name: Build
        working-directory: contracts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          stellar contract build \
            --package allowance \
            --locked \
            --out-dir "$GITHUB_WORKSPACE/dist" \
            --meta source_repo=github:"$GITHUB_REPOSITORY" \
            --meta version="$VERSION"

      - name: Hash
        id: wasm
        run: |
          sha256=$(stellar contract info hash --wasm dist/allowance.wasm)
          echo "$sha256"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      # GitHub does not issue attestations for user-owned private repositories, and the
      # step fails rather than skipping. The release is still worth publishing without one.
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: dist/allowance.wasm

      # Re-runnable. Going public and re-running a release rewrites its notes rather
      # than failing on a tag that already has a release.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.wasm.outputs.sha256 }}
          VERSION: ${{ steps.version.outputs.version }}
          ATTESTED: ${{ github.event.repository.visibility == 'public' }}
        run: |
          echo "Version \`$VERSION\`, wasm hash \`$SHA256\`, built from \`$GITHUB_SHA\`." > notes.md
          cat >> notes.md <<'EOF'

          Deploy the file attached here rather than a local build. A local build omits the
          `source_repo` and `version` metadata, which produces different bytes and a
          different hash.
          EOF
          if [ "$ATTESTED" = "true" ]; then
          cat >> notes.md <<'EOF'

          These bytes carry a build attestation, so they can be traced back to the commit
          that produced them.

              stellar contract info build --wasm allowance.wasm
          EOF
          else
          cat >> notes.md <<'EOF'

          No build attestation. GitHub does not issue them for private repositories. The
          build is pinned, so re-running this release once the repository is public
          produces the same hash and attests it.
          EOF
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/allowance.wasm --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/allowance.wasm --notes-file notes.md
          fi
