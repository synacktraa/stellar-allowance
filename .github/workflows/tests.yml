name: tests

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo fmt --all -- --check
      # The factory's tests deploy the allowance by hash, so its built artifact has to exist
      # before anything compiles them, clippy included.
      - run: cargo build --release --target wasm32v1-none -p allowance
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
